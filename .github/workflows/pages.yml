# Publishes the static site (the site/ folder) to GitHub Pages on every push that changes it.
# One-time setup in the repository on GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Two jobs, as in GitHub's own starter workflow: the deploy step looks the uploaded artifact up through
# the API, and when it runs in the same job a few hundred milliseconds after the upload it can find none.
name: Publish site
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
