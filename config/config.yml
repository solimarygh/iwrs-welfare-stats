# ---------------------------------------------------------------------------
# Central configuration. Everything that defines "what we count" lives here,
# so the yearly update only needs to touch this file (usually just `years`).
# ---------------------------------------------------------------------------

project:
  years: [2016, 2026]        # inclusive; the current calendar year is flagged as partial

openalex:
  base_url: "https://api.openalex.org"
  # Contact address for the OpenAlex "polite pool". Preferably NOT here: set the
  # environment variable OPENALEX_MAILTO in ~/.Renviron (see README).
  mailto: "CHANGE_ME@example.org"
  # Proxy for "peer-reviewed publication": journal articles and reviews published
  # in a journal-type source. Preprints in repositories, editorials and letters are excluded.
  work_types: ["article", "review"]
  source_type: "journal"
  # Wildcards (*) are only accepted by the exact (non-stemmed) field. That field does
  # no stemming, so plurals and other inflections must be listed explicitly.
  search_field: "title_and_abstract.search.exact"

search:
  # Terms listed under `noisy` have frequent non-biological meanings (a cricket
  # match, a computer bug, a tick in a form). They are excluded by default and
  # can be switched on for a sensitivity analysis.
  include_noisy: false

# ---------------------------------------------------------------------------
# Taxon groups. `arthropod: true` tags a group as Arthropoda; the pipeline
# also reports the union of all arthropod groups (ALL_ARTHROPODS) and of all
# groups (ALL_INVERTEBRATES).
#
# Syntax (OpenAlex exact search, no stemming): `*` is a wildcard; every inflected
# form that matters (bee / bees) is listed explicitly.
# Papers matched only through generic words ("invertebrate*") cannot be
# assigned to arthropods and fall in `invertebrates_general`.
# ---------------------------------------------------------------------------
taxa:
  insects:
    arthropod: true
    terms: ["insect*", "honey bee", "honey bees", "honeybee*", "bumble bee", "bumble bees",
            "bumblebee*", "bee", "bees", "Drosophila", "black soldier fly", "black soldier flies",
            "mealworm*", "Tenebrio", "Hermetia", "locust*", "cockroach*", "butterfl*",
            "beetle*", "Apis mellifera", "Bombus"]
    noisy: ["cricket*", "ant", "ants", "moth*", "bug*"]
  crustaceans:
    arthropod: true
    terms: ["crustacean*", "decapod*", "crab*", "lobster*", "shrimp*", "crayfish",
            "prawn*", "isopod*", "amphipod*"]
    noisy: []
  other_arthropods:
    arthropod: true
    terms: ["arachnid*", "spider*", "scorpion*", "mite*", "horseshoe crab", "horseshoe crabs",
            "myriapod*", "centipede*", "millipede*"]
    noisy: ["tick", "ticks"]
  arthropods_general:
    arthropod: true
    terms: ["arthropod*"]
    noisy: []
  cephalopods:
    arthropod: false
    terms: ["cephalopod*", "octopus*", "octopod*", "squid*", "cuttlefish*", "nautilus"]
    noisy: []
  other_molluscs:
    arthropod: false
    terms: ["mollus*", "gastropod*", "snail*", "bivalve*", "oyster*", "mussel*", "Aplysia"]
    noisy: ["slug*"]
  other_invertebrates:
    arthropod: false
    terms: ["annelid*", "leech*", "earthworm*", "nematode*", "Caenorhabditis", "planarian*",
            "cnidarian*"]
    noisy: ["sponge*"]
  invertebrates_general:
    arthropod: false
    terms: ["invertebrate*"]
    noisy: []

# ---------------------------------------------------------------------------
# State blocks. "affect" alone is deliberately NOT a term: as a verb it is noise.
# Wildcards are avoided on "pain" (pain* would match "painted", "painting").
# ---------------------------------------------------------------------------
states:
  sentience:
    terms: ["sentien*"]
  affect_emotion:
    terms: ["affective state", "affective states", "affect-like", "emotion*", "emotion-like",
            "emotional state", "emotional states", "cognitive bias", "cognitive biases"]
  consciousness:
    terms: ["conscious*", "subjective experience", "subjective experiences"]
  welfare:
    terms: ["welfare", "well-being", "wellbeing", "suffering"]
  nociception_pain:
    terms: ["nocicept*", "pain", "painful", "noxious stimulus", "noxious stimuli", "analges*"]

# ---------------------------------------------------------------------------
# Validation sample (script 03). A paper can match several state blocks and taxon
# groups; it is assigned to the FIRST one in these lists, listed rarest-first so
# that rare categories are well represented. Weights (stratum_N / stratum_n) are
# stored so that precision can be estimated for the whole set afterwards.
# ---------------------------------------------------------------------------
sampling:
  seed: 2026
  n_per_state_block: 60
  n_untagged: 20          # records WITH an abstract that the local tagging could not assign
  n_no_abstract: 60       # records still without an abstract after recovery (judged by title)
  state_priority: ["sentience", "consciousness", "affect_emotion", "welfare", "nociception_pain"]
  taxon_priority: ["cephalopods", "other_molluscs", "other_invertebrates", "crustaceans",
                   "other_arthropods", "arthropods_general", "invertebrates_general", "insects"]

# ---------------------------------------------------------------------------
# CORE definition (strict). The broad search above counts any paper that mentions a
# taxon term and a state term anywhere in its title or abstract; a first read of random
# titles showed that most of those are not about the animals' welfare (human welfare,
# venom pharmacology, fish farming...). The core keeps only papers in which an animal
# word and a state word appear NEAR each other (within `proximity` words, in any order),
# e.g. "insects welfare", "welfare of farmed insects", "sentient crabs".
# Words must be single tokens; list singular and plural (the exact field does not stem).
# Add an animal you miss to `taxon_nouns`; each one is crossed with every state word.
# ---------------------------------------------------------------------------
core:
  proximity: 6
  taxon_nouns: ["invertebrate", "invertebrates", "insect", "insects", "arthropod", "arthropods",
                "crustacean", "crustaceans", "decapod", "decapods", "cephalopod", "cephalopods",
                "mollusc", "molluscs", "mollusk", "mollusks",
                "shrimp", "shrimps", "prawn", "prawns", "crab", "crabs", "lobster", "lobsters", "crayfish",
                "octopus", "octopuses", "octopi", "squid", "cuttlefish",
                "bee", "bees", "honeybee", "honeybees", "bumblebee", "bumblebees",
                "cricket", "crickets", "mealworm", "mealworms", "locust", "locusts",
                "cockroach", "cockroaches", "drosophila"]
  states:
    sentience:        ["sentience", "sentient"]
    affect_emotion:   ["emotion", "emotions", "emotional", "affective"]
    consciousness:    ["consciousness", "conscious"]
    welfare:          ["welfare", "wellbeing", "suffering"]
    nociception_pain: ["pain", "painful", "nociception", "nociceptive"]
