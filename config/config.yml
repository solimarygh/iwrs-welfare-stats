# ---------------------------------------------------------------------------
# Central configuration. Everything that defines "what we count" lives here,
# so the yearly update only needs to touch this file (usually just `years`).
# ---------------------------------------------------------------------------

project:
  years: [2016, 2026]        # inclusive; the current calendar year is flagged as partial

openalex:
  base_url: "https://api.openalex.org"
  # Contact address for the OpenAlex "polite pool". Preferably NOT here: set the
  # environment variable OPENALEX_MAILTO in ~/.Renviron (see README).
  mailto: "CHANGE_ME@example.org"
  # Proxy for "peer-reviewed publication": journal articles and reviews published
  # in a journal-type source. Preprints in repositories, editorials and letters are excluded.
  work_types: ["article", "review"]
  source_type: "journal"
  # Wildcards (*) are only accepted by the exact (non-stemmed) field. That field does
  # no stemming, so plurals and other inflections must be listed explicitly.
  search_field: "title_and_abstract.search.exact"

search:
  # Terms listed under `noisy` have frequent non-biological meanings (a cricket
  # match, a computer bug, a tick in a form). They are excluded by default and
  # can be switched on for a sensitivity analysis.
  include_noisy: false

# ---------------------------------------------------------------------------
# Taxon groups. `arthropod: true` tags a group as Arthropoda; the pipeline
# also reports the union of all arthropod groups (ALL_ARTHROPODS) and of all
# groups (ALL_INVERTEBRATES).
#
# Syntax (OpenAlex exact search, no stemming): `*` is a wildcard; every inflected
# form that matters (bee / bees) is listed explicitly.
# Papers matched only through generic words ("invertebrate*") cannot be
# assigned to arthropods and fall in `invertebrates_general`.
# ---------------------------------------------------------------------------
taxa:
  insects:
    arthropod: true
    terms: ["insect*", "honey bee", "honey bees", "honeybee*", "bumble bee", "bumble bees",
            "bumblebee*", "stingless bee", "stingless bees", "bee", "bees", "wasp", "wasps",
            "hornet", "hornets", "butterfl*", "caterpillar*", "beetle*", "mosquito", "mosquitoes",
            "mosquitos", "grasshopper*", "locust*", "cockroach*", "termite*", "aphid*", "silkworm*",
            "mealworm*", "crickets", "house cricket", "house crickets", "black soldier fly",
            "black soldier flies", "fruit fly", "fruit flies", "house fly", "house flies", "housefly",
            "houseflies", "Drosophila", "Apis", "Bombus", "Tenebrio", "Hermetia", "Acheta", "Gryllus",
            "Periplaneta", "Schistocerca", "Locusta", "Bombyx", "Musca", "Tribolium", "Galleria"]
    noisy: ["cricket", "ant", "ants", "moth*", "bug*"]
  crustaceans:
    arthropod: true
    terms: ["crustacean*", "decapod*", "crab", "crabs", "lobster*", "shrimp*", "prawn*", "crayfish",
            "crawfish", "krill", "isopod*", "amphipod*", "copepod*", "barnacle*", "Daphnia", "Artemia",
            "Penaeus", "Litopenaeus", "Macrobrachium", "Homarus", "Nephrops", "Procambarus", "Carcinus",
            "Pacifastacus", "Astacus", "Cherax"]
    noisy: []
  other_arthropods:
    arthropod: true
    terms: ["arachnid*", "spider*", "scorpion*", "tarantula*", "mite", "mites", "horseshoe crab",
            "horseshoe crabs", "myriapod*", "centipede*", "millipede*", "harvestman", "harvestmen"]
    noisy: ["tick", "ticks"]
  arthropods_general:
    arthropod: true
    terms: ["arthropod*"]
    noisy: []
  cephalopods:
    arthropod: false
    terms: ["cephalopod*", "octopus*", "octopod*", "octopi", "squid", "squids", "cuttlefish*",
            "nautilus", "nautiluses", "Sepia"]
    noisy: []
  other_molluscs:
    arthropod: false
    terms: ["mollus*", "gastropod*", "snail*", "bivalve*", "oyster*", "mussel*", "clam", "clams",
            "scallop*", "abalone*", "limpet*", "whelk*", "Aplysia", "Lymnaea"]
    noisy: ["slug*"]
  other_invertebrates:
    arthropod: false
    terms: ["annelid*", "leech*", "earthworm*", "nematode*", "Caenorhabditis", "planarian*", "cnidarian*",
            "jellyfish*", "sea urchin", "sea urchins", "starfish", "sea star", "sea stars", "echinoderm*",
            "polychaete*", "tardigrade*", "rotifer*", "coral", "corals"]
    noisy: ["sponge*"]
  invertebrates_general:
    arthropod: false
    terms: ["invertebrate*"]
    noisy: []

# ---------------------------------------------------------------------------
# State blocks. "affect" alone is deliberately NOT a term: as a verb it is noise.
# Wildcards are avoided on "pain" (pain* would match "painted", "painting").
# ---------------------------------------------------------------------------
states:
  sentience:
    terms: ["sentien*"]
  affect_emotion:
    terms: ["affective", "affective state", "affective states", "affect-like", "emotion*", "emotion-like",
            "emotional state", "emotional states", "cognitive bias", "cognitive biases"]
  consciousness:
    terms: ["conscious*", "subjective experience", "subjective experiences"]
  welfare:
    terms: ["welfare", "well-being", "wellbeing", "suffering"]
  nociception_pain:
    terms: ["nocicept*", "pain", "painful", "noxious stimulus", "noxious stimuli", "analges*"]

# ---------------------------------------------------------------------------
# Validation sample (script 03). A paper can match several core blocks and taxon
# groups; it is assigned to the FIRST one in these lists, listed rarest-first so
# that rare categories are well represented. Weights (stratum_N / stratum_n) are
# stored so that precision can be estimated for the whole set afterwards.
# ---------------------------------------------------------------------------
sampling:
  seed: 2026
  n_per_state_block: 60
  n_broad_only: 100       # records with an abstract that are in the broad set but not in the core
  n_no_abstract: 60       # records still without an abstract after recovery (judged by title)
  state_priority: ["sentience", "consciousness", "affect_emotion", "welfare", "nociception_pain"]
  taxon_priority: ["cephalopods", "other_molluscs", "other_invertebrates", "crustaceans",
                   "other_arthropods", "arthropods_general", "invertebrates_general", "insects"]

# ---------------------------------------------------------------------------
# CORE definition (strict), applied LOCALLY to the downloaded titles and abstracts.
# The broad search above counts any paper that mentions a taxon term and a state term
# anywhere; a first read of random titles showed most of those are not about the animals'
# welfare (human welfare, venom pharmacology, fish farming...). The core keeps a paper only
# when an animal word (any term of `taxa` above) and a state word of one block appear
# within `proximity` words of each other, in any order: "insect welfare", "welfare of
# farmed insects", "sentient crabs". Words may end in * (prefix) or be a phrase.
# Every state word must also be matched by the broad search (a test checks this), because
# the core can only find papers that the broad search retrieved.
# ---------------------------------------------------------------------------
core:
  proximity: 6
  # Tokens a wildcard would wrongly catch (insect* also matches insecticide).
  noun_exclude: ["insectic*", "insectivor*", "insectar*", "molluscic*", "nematicid*"]
  states:
    sentience:        ["sentien*"]
    affect_emotion:   ["emotion*", "affective"]
    consciousness:    ["conscious*"]
    welfare:          ["welfare", "wellbeing", "well-being", "suffering"]
    nociception_pain: ["pain", "painful", "nocicept*"]
  # Two filters on top of the word pattern (added 2026-11-24 after the first validation
  # showed that most core papers that were not on topic use an animal word in another
  # sense: metaphors, algorithms, clinical case reports).
  filters:
    # The animal word is in the title or occurs at least this many times in title + abstract.
    subject_min_mentions: 2
    # OpenAlex fields in which an invertebrate-welfare paper is not expected. Fixed before
    # looking at the field of the labelled papers; Medicine, Arts and Humanities, Social
    # Sciences, Psychology and Pharmacology are NOT excluded until a fresh sample can test it.
    exclude_fields:
      - "Computer Science"
      - "Engineering"
      - "Mathematics"
      - "Business, Management and Accounting"
      - "Economics, Econometrics and Finance"
      - "Decision Sciences"
      - "Energy"
      - "Materials Science"
      - "Chemical Engineering"
      - "Chemistry"
      - "Physics and Astronomy"
      - "Dentistry"
      - "Nursing"
      - "Health Professions"

# ---------------------------------------------------------------------------
# Members map (script 06). The membership list holds personal data: it stays in
# data/private/ (ignored by git) and only counts per country leave it.
# ---------------------------------------------------------------------------
members:
  file: "data/private/Membership Application_Anonymized.xlsx"
  sheet: 1
  country_column: ~        # ~ = find the column whose header mentions country / pais
  min_cell: 5              # a country (or country x term) with fewer members is shown as "fewer than 5"
  # Filters for the map. Each takes the columns whose header STARTS with one of `headers`
  # (duplicated headers are merged per person). Values are free text: they are split on
  # commas, semicolons, slashes and "and", lower-cased, and mapped through `aliases`
  # (a CSV with columns term,canonical,facet; term can be regex:...; an empty canonical drops it).
  # Keep it to generic vocabulary: it is committed, so it must not contain anything personal.
  # Only terms stated by at least min_cell members are published, never the others.
  facets:
    membership_type: {label: "Membership type",       headers: ["Membership Type"], split: false}
    discipline:  {label: "General discipline",          headers: ["General Discipline"]}
    taxon_order: {label: "Taxonomic expertise (order)",  headers: ["Taxonomic Expertise"]}
    keywords:    {label: "Research interest",           headers: ["Research Interest Keywords"]}
    species:     {label: "Species expertise",           headers: ["Species-Specific Expertise"]}
  aliases: "data/reference/member_term_aliases.csv"
  max_terms: 40            # most frequent terms kept per filter

# ---------------------------------------------------------------------------
# Journal groups (script 07). Each paper of the core is assigned to the FIRST group whose
# pattern matches the lower-case journal name (regular expressions); the rest go to "other".
# Edit the lists freely: IWRS can add the journals it cares about.
# ---------------------------------------------------------------------------
journals:
  top_n: 25                # journals kept per taxon group for the "most frequent journals" table
  groups:
    - key: multidisciplinary
      label: "High-impact multidisciplinary"
      patterns: ["^nature$", "^science$", "^proceedings of the national academy of sciences",
                 "^nature communications$", "^science advances$"]
    - key: animal_welfare
      label: "Animal welfare and behaviour"
      patterns: ["animal welfare", "applied animal behaviou?r", "animal sentience", "^animals?$",
                 "animal behaviou?r", "animal cognition", "animal frontiers", "zoo biology",
                 "veterinar", "animal science"]
    - key: entomology
      label: "Entomology and insect science"
      patterns: ["entomolog", "insect", "apicultur", "bee world", "pollinat"]
    - key: aquaculture
      label: "Aquaculture and fisheries"
      patterns: ["aquacultur", "fisher", "^fishes$", "marine", "shellfish"]
    - key: medicine_toxicology
      label: "Medicine, toxicology and pharmacology"
      patterns: ["toxin", "toxicon", "toxicol", "pharmac", "^molecules$", "cureus", "medicine", "clinical",
                 "medical", "molecular pain", "^pain$"]
    - key: food
      label: "Food science and nutrition"
      patterns: ["food", "nutrition", "gastronom", "culinary"]
    - key: psychology_philosophy
      label: "Psychology, philosophy and consciousness"
      patterns: ["psycholog", "philosoph", "ethic", "consciousness", "cognit", "mind"]
    - key: general_biology
      label: "General biology, physiology and neuroscience"
      patterns: ["experimental biology", "physiolog", "^elife$", "royal society", "biology letters", "current biology",
                 "behavioral ecology", "behavioural ecology", "ecology", "neuroscience", "neurobiolog", "^biology$",
                 "evolution", "iscience", "communications biology", "biology open"]
    - key: megajournal
      label: "Open-access megajournals"
      patterns: ["^scientific reports$", "^plos one$", "^peerj$"]
  other_label: "Other journals"

# ---------------------------------------------------------------------------
# Events and theses (script 08): the template IWRS fills in (data/templates/), saved here.
# ---------------------------------------------------------------------------
events:
  file: "data/curated/IWRS_events_and_theses.xlsx"
